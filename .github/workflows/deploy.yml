name: Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment tier to deploy to.
        required: true
        type: string

jobs:
  # preflight check verifies the VM has been provisioned (tofu apply in
  # ardcnectar/tofu) before attempting deployment
  # outputs vm_ready=true/false which gates the deploy job
  check-vm:
    runs-on: ubuntu-latest
    # VM_IP and SSH_PRIVATE_KEY are environment-scoped (ardcnectar/tofu/github.tf),
    # so this job must declare the environment to resolve them.
    environment: ${{ inputs.environment }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      vm_ready: ${{ steps.check.outputs.vm_ready }}
    steps:
      - name: Check VM secrets and reachability
        id: check
        run: |
          # secrets render as empty string when not set — check both are configured
          if [ -z "${{ secrets.VM_IP }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "VM secrets not set — run 'tofu apply' (ardcnectar/tofu) first to provision the VM"
            echo "vm_ready=false" >> $GITHUB_OUTPUT
          # check port 22 is open — VM exists and is running
          elif nc -z -w5 ${{ secrets.VM_IP }} 22 2>/dev/null; then
            echo "VM is reachable — proceeding with deployment"
            echo "vm_ready=true" >> $GITHUB_OUTPUT
          else
            echo "VM_IP is set but port 22 is unreachable — VM may be down or still booting"
            echo "vm_ready=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check-vm
    # skip gracefully if VM is not ready — shows as 'skipped' not 'failed' in Actions UI
    if: needs.check-vm.outputs.vm_ready == 'true'
    runs-on: ubuntu-latest
    # scopes the deploy secrets and applies the environment's required reviewer
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # poll port 22 until SSH is accepting connections, takes awhile after instance is built
      # timeout after 10 minutes (60 attempts x 10s)
      - name: Wait for SSH to be ready
        run: |
          echo "Waiting for SSH on ${{ secrets.VM_IP }}..."
          for i in $(seq 1 60); do
            nc -z -w5 ${{ secrets.VM_IP }} 22 && echo "SSH ready." && exit 0
            echo "Attempt $i/60 — retrying in 10s..."
            sleep 10
          done
          echo "SSH did not become ready in time." && exit 1

      - name: Add VM to known hosts
        run: ssh-keyscan -H ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts

      # the VM already knows its own domain: cloud-init writes 03_generate_config.sh
      # (write_files) long before runcmd requests the certificate, so this is readable
      # here and keeps the workflow free of hardcoded hostnames
      - name: Discover app domain from the VM
        id: vm
        run: |
          FQDN=$(ssh ubuntu@${{ secrets.VM_IP }} \
            "grep -oP 'SPATIALDATA_URI=https?://\K[^/]+' /opt/scripts/03_generate_config.sh")
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "App domain: ${FQDN}"

      # wait for cloud-init to finish running 02_get_cert.sh
      # timeout after 20 minutes (80 attempts x 15s)
      - name: Wait for SSL certificate
        run: |
          echo "Waiting for certbot to complete..."
          for i in $(seq 1 80); do
            ssh ubuntu@${{ secrets.VM_IP }} \
              "sudo test -f /etc/letsencrypt/live/${{ steps.vm.outputs.fqdn }}/fullchain.pem" \
              && echo "Certificate ready." && exit 0
            echo "Attempt $i/80 — retrying in 15s..."
            sleep 15
          done
          echo "Certificate did not appear in time." && exit 1

      # capture current HEAD before any changes — used by rollback step if deploy fails
      - name: Snapshot current HEAD
        id: snapshot
        run: |
          OLD_HEAD=$(ssh ubuntu@${{ secrets.VM_IP }} "cd /opt/wtx_viewer && git rev-parse HEAD")
          echo "old_head=${OLD_HEAD}" >> $GITHUB_OUTPUT
          echo "Snapshot: ${OLD_HEAD}"

      - name: Pull latest code and restart containers
        run: |
          ssh ubuntu@${{ secrets.VM_IP }} << 'EOF'
            set -e
            cd /opt/wtx_viewer

            git fetch origin main
            git reset --hard origin/main

            # show changed files for debugging
            echo "--- Files changed in this update ---"
            git diff HEAD~1 HEAD --name-only

            # rebuild vitessce-config image and regenerate config.json on every deploy
            # pip install layers are Docker-cached so only COPY src re-runs when source changes
            echo "Building vitessce-config image..."
            docker build -t vitessce-config vitessce_config/

            SPATIALDATA_URI=$(grep 'SPATIALDATA_URI=' /opt/scripts/03_generate_config.sh \
              | grep -oP 'https?://[^\s\\]+')
            echo "SPATIALDATA_URI=${SPATIALDATA_URI}"

            docker run --rm \
              -v /opt/wtx_viewer/vitessce_config:/output \
              -e SPATIALDATA_URI=${SPATIALDATA_URI} \
              vitessce-config

            echo "config.json updated: $(stat -c '%y' /opt/wtx_viewer/vitessce_config/config.json)"

            export GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            export GIT_HASH=$(git rev-parse --short HEAD)
            export GIT_DATE=$(git log -1 --format=%cd --date=short)
            docker compose up --build -d --wait
          EOF

      # confirm the app and the data store both respond over HTTPS
      # /zarr/.zgroup goes through data_store to Swift, so a data outage fails here
      - name: Health check
        run: |
          sleep 5
          for path in / /zarr/.zgroup; do
            code=$(curl --silent --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://${{ steps.vm.outputs.fqdn }}${path}") || true
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "Health check failed"; exit 1; }
          done
          echo "Health check passed"

      # rollback to previous commit if deploy or health check failed
      - name: Rollback to previous commit
        if: failure()
        run: |
          OLD_HEAD=${{ steps.snapshot.outputs.old_head }}
          echo "!!! Rolling back to ${OLD_HEAD} !!!"
          ssh ubuntu@${{ secrets.VM_IP }} << EOF
            set -e
            cd /opt/wtx_viewer

            git reset --hard ${OLD_HEAD}
            echo "Reverted to: \$(git log -1 --oneline)"

            docker build -t vitessce-config vitessce_config/

            SPATIALDATA_URI=\$(grep 'SPATIALDATA_URI=' /opt/scripts/03_generate_config.sh \
              | grep -oP 'https?://[^\s\\\\]+')
            docker run --rm \
              -v /opt/wtx_viewer/vitessce_config:/output \
              -e SPATIALDATA_URI=\${SPATIALDATA_URI} \
              vitessce-config

            export GIT_BRANCH=\$(git rev-parse --abbrev-ref HEAD)
            export GIT_HASH=\$(git rev-parse --short HEAD)
            export GIT_DATE=\$(git log -1 --format=%cd --date=short)
            docker compose up --build -d --wait

            echo "Rollback complete — previous version is live."
          EOF

      # print container logs after rollback for debugging
      - name: Dump container logs on failure
        if: failure()
        run: |
          ssh ubuntu@${{ secrets.VM_IP }} \
            "docker compose -f /opt/wtx_viewer/docker-compose.yml logs --tail=50"
